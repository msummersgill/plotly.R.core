# Build the pkgdown site and publish it to the gh-pages branch.
# Adapted from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only one deploy at a time
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown publishes every top-level .md file as a page
      - name: Drop CLAUDE.md
        run: rm -f CLAUDE.md

      # Loud, so a failing article shows its error; retried once, as articles
      # that fetch data or drive headless Chrome can fail transiently
      - name: Build site
        run: |
          build <- function() {
            pkgdown::build_site_github_pages(
              new_process = FALSE,
              install = FALSE,
              quiet = FALSE
            )
          }
          ok <- tryCatch(
            {
              build()
              TRUE
            },
            error = function(e) {
              message("Site build failed, retrying once:\n", conditionMessage(e))
              FALSE
            }
          )
          if (!ok) build()
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
