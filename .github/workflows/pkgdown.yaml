# Build the pkgdown site and publish it to the gh-pages branch.
# Adapted from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only one deploy at a time
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Shinylive apps (articles/streaming) install their packages in the
      # browser when they start, rather than bundling WebAssembly builds
      # into the site
      SHINYLIVE_WASM_PACKAGES: 0
      # The shinylive R package's default assets (0.9.1) run webR with R 4.4,
      # whose WebAssembly package repository is out of date (e.g. data.table
      # can't be downloaded); 0.10.16 runs R 4.6
      SHINYLIVE_ASSETS_VERSION: 0.10.16
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown publishes every top-level .md file as a page
      - name: Drop CLAUDE.md
        run: rm -f CLAUDE.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # pkgdown renders articles quietly, hiding Quarto's errors: on a failure,
      # render them again with Quarto's output shown
      - name: Show article build output
        if: failure()
        run: pkgdown::build_articles(quiet = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
