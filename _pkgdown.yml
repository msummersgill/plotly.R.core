url: https://msummersgill.github.io/plotly.R.core/

template:
  bootstrap: 5

navbar:
  structure:
    left: [reference, articles, news]
    right: [search, github]

articles:
  - title: Articles
    navbar: ~
    contents:
      - crosstalk
      - streaming
      - static-export
      - render-performance
reference:
  - title: Figures
    contents:
      - go_figure
      - add_traces
      - make_subplots
      - print_grid
      - select_traces
      - plotly_obj-modify
      - last_plot
      - print.go_figure
      - print.plotly_obj
  - title: Updating figures
    contents:
      - starts_with("update_")
  - title: Traces
    contents:
      - starts_with("go_")
      - -go_figure
      - -go_layout
      - -go_font
      - -go_colorbar
      - -go_hoverlabel
      - -go_legendgrouptitle
      - -go_tickformatstop
      - -go_domain
      - -go_pattern
      - -go_error_bar
      - -go_autorangeoptions
      - -go_bins
      - -go_caps
      - -go_domainpad
      - -go_gradient
      - -go_label
      - -go_leaf
      - -go_lightposition
      - -go_minor
      - -go_pathbar
      - -go_project
      - -go_rangebreak
      - -go_root
      - -go_slices
      - -go_spaceframe
      - -go_unifiedhovertitle
  - title: Layout
    contents:
      - go_layout
      - add_annotation
      - add_shape
      - add_layout_image
      - add_selection
  - title: Shared object types
    desc: Objects used in several places in traces and layouts.
    contents:
      - go_font
      - go_colorbar
      - go_hoverlabel
      - go_legendgrouptitle
      - go_tickformatstop
      - go_domain
      - go_pattern
      - go_error_bar
      - go_autorangeoptions
      - go_bins
      - go_caps
      - go_domainpad
      - go_gradient
      - go_label
      - go_leaf
      - go_lightposition
      - go_minor
      - go_pathbar
      - go_project
      - go_rangebreak
      - go_root
      - go_slices
      - go_spaceframe
      - go_unifiedhovertitle
  - title: Plotly Express
    contents:
      - starts_with("px_")
  - title: Rendering and export
    contents:
      - plotly_widget
      - as_float32
      - partial_bundle
      - config
      - write_html
      - save_image
      - install_chrome
      - plotly_json
      - TeX
      - plotlyjs_version
  - title: Shiny
    contents:
      - plotlyOutput
      - plotlyProxy
      - event_data
      - event_register
  - title: Linked views (crosstalk)
    contents:
      - highlight
      - set_crosstalk_keys
  - title: Templates, schema and validation
    contents:
      - get_template
      - schema
