url: https://msummersgill.github.io/plotly.R.core/

template:
  bootstrap: 5

navbar:
  structure:
    left: [reference, articles, news]
    right: [search, github]

articles:
  - title: Articles
    navbar: ~
    contents:
      - crosstalk
      - streaming
      - static-export
      - render-performance
reference:
  - title: Figures
    contents:
      - go_figure
      - add_traces
      - make_subplots
      - print_grid
      - select_traces
      - plotly_obj-modify
      - last_plot
      - print.go_figure
      - print.plotly_obj
  - title: Updating figures
    contents:
      - starts_with("update_")
  - title: Traces
    desc: One constructor per trace type; add_<trace>() adds one to a figure.
    contents:
      - has_concept("traces")
  - title: Trace objects
    desc: Objects nested in traces, named after their path.
    contents:
      - has_concept("trace objects")
  - title: Layout
    desc: The layout and the objects in it.
    contents:
      - has_concept("layout objects")
  - title: Shared object types
    desc: Objects used in several places in traces and layouts.
    contents:
      - has_concept("shared object types")
  - title: Plotly Express
    contents:
      - starts_with("px_")
  - title: Rendering and export
    contents:
      - plotly_widget
      - as_float32
      - partial_bundle
      - config
      - write_html
      - save_image
      - available_fonts
      - install_chrome
      - plotly_json
      - TeX
      - plotlyjs_version
  - title: Shiny
    contents:
      - plotlyOutput
      - plotlyProxy
      - event_data
      - event_register
  - title: Linked views (crosstalk)
    contents:
      - highlight
      - set_crosstalk_keys
  - title: Templates, schema and validation
    contents:
      - get_template
      - schema
