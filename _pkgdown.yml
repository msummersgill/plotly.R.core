url: https://msummersgill.github.io/plotly.R.core/

template:
  bootstrap: 5

navbar:
  structure:
    left: [reference, articles, news]
    right: [search, github]

articles:
  - title: Articles
    navbar: ~
    contents:
      - crosstalk
      - streaming
      - static-export
      - render-performance
