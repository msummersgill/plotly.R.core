# The full plotly.js bundle, so every widget has plotly.js. plotly_widget()
# also attaches the bundle it uses (see plotlyjs_dependency()), at a higher
# version, which replaces this one.
dependencies:
  - name: plotly-main
    version: 4.3.0
    src: htmlwidgets/lib/plotlyjs
    script: plotly.min.js
  # decoding of the serialiser's typed arrays, shared arrays and dates
  - name: plotly-core-codec
    version: 0.1.0
    src: htmlwidgets/lib/plotlycore
    script: codec.js
